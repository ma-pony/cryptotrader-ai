services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cryptotrader
      POSTGRES_USER: ${POSTGRES_USER:-cryptotrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptotrader-local-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptotrader}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Keep DB up across laptop sleep/wake. Without this, Docker Desktop
    # restarting the engine on resume would leave postgres dead and the
    # API would self-report ``db: unavailable`` indefinitely (observed
    # 2026-05-03 morning recovery).
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Same reasoning as postgres above — auto-resume after Docker engine
    # restart so cooldowns / cycle locks / breaker state stay reachable.
    restart: unless-stopped

  api:
    build: .
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cryptotrader}:${POSTGRES_PASSWORD:-cryptotrader-local-dev}@postgres:5432/cryptotrader
      CONFIG_MASTER_KEY: ${CONFIG_MASTER_KEY:?CONFIG_MASTER_KEY is required}
    volumes:
      - ctdata:/home/appuser/.cryptotrader
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # PROD-C2: strict healthcheck — only HTTP 200 counts as healthy.
    # Previously the check swallowed HTTPError, so 503 (DB/Redis down) was
    # treated as healthy and the `web` service started against a broken API.
    # start_period gives time for migrations + first DB/Redis connect.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys,urllib.request as u; sys.exit(0 if u.urlopen(\"http://localhost:8003/health\", timeout=5).getcode()==200 else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  # Reverse proxy with automatic Let's Encrypt — only used in VPS
  # deployment (see docs/DEPLOYMENT.md). Local-dev runs ``api`` and
  # ``web`` on host ports directly without Caddy. Use ``--profile prod``
  # to opt in: ``docker compose --profile prod up -d``.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ctdata:
  caddydata:
  caddyconfig:
  hf_cache:
