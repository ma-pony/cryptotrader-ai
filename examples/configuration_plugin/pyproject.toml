[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotrader-configuration-example"
version = "0.1.0"
description = "Offline typed configuration example; always emits a neutral signal"
requires-python = ">=3.12"

[project.entry-points."cryptotrader.signal_components"]
configuration_example = "configuration_example:create_component"

[tool.setuptools]
py-modules = ["configuration_example"]
